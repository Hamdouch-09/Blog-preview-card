<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <!-- link style -->
    <link rel="stylesheet" href="main.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="container">
      <main>
        <!-- card -->
        <article class="card">
          <div>
            <img
              src="./assets/images/illustration-article.svg"
              alt="Illustration for the article"
            />
          </div>
          <!-- card content -->
          <div class="card-content">
            <p class="card-tag">Learning</p>

            <time datetime="2023-12-21">Published 21 Dec 2023</time>
            <h1>HTML & CSS foundations</h1>

            <p class="card-text">
              These languages are the backbone of every website, defining
              structure, content, and presentation.
            </p>
          </div>
          <div class="usernam">
            <div class="img">
              <img src="./assets/images/image-avatar.webp" alt="Imag avatar" />
            </div>
            <p class="name">Greg Hooper</p>
          </div>
        </article>
      </main>

      <footer>
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          rel="noopener noreferrer"
          target="_blank"
          title="www.frontendmentor.io"
          >Frontend Mentor</a
        >. Coded by
        <a
          href="https://x.com/Hmadouch_09 "
          rel="noopener noreferrer"
          target="_blank"
          title="Profile X.com"
          >Hamdouch-09.</a
        >
      </footer>
    </div>
  </body>
</html>
